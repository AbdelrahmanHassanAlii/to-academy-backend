        Arabic descriptions, valid future schedule and positive duration; optional related course
        must exist; deadline cannot follow schedule. Published URLs remain stable. A lecture with
        reserved seats cannot become draft. Capacity cannot be reduced below reservedSeats and
        concurrent reservations cause a retryable conflict rather than overbooking.
