      summary: List published lectures
      description:
        Public projection never contains meetingUrl. Registration does not grant meeting URL
        access; administrators share meeting details manually outside the website. No public
        search/featured result contains private URLs. Cancelled, completed and draft lectures are
        hidden. Past published lectures remain visible unless filtered.
      security: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - &a9
          in: query
          name: q
          schema:
            type: string
            maxLength: 100
            minLength: 1
          description: Literal Arabic/English title search; regex characters are escaped.
        - &a10
          in: query
          name: course
          schema: &a14
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - &a11
          in: query
          name: period
          schema:
            type: string
            enum:
              - upcoming
              - past
          description: 'upcoming: scheduledAt > now; past: scheduledAt <= now. Published-only publicly.'
        - &a12
          in: query
          name: sort
          schema:
            type: string
            enum:
              - schedule
              - latest
              - newest
              - oldest
              - title
            default: schedule
      responses:
        '200':
          description: List published lectures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LecturePublicListResponse'
        '400': &a1
          description:
            'VALIDATION_ERROR / INVALID_JSON: malformed input, query, id, date, duration, deadline,
            consent or status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403': &a2
          description: 'ORIGIN_FORBIDDEN / CSRF_INVALID: trusted Origin or CSRF denied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': &a3
          description:
            'LECTURE_NOT_FOUND / COURSE_NOT_FOUND / REGISTRATION_NOT_FOUND: absent target, or
            hidden public content.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409': &a4
          description:
            LECTURE_CONFLICT / LECTURE_SLUG_EXISTS / REGISTRATION_CONFLICT / REGISTRATION_EXISTS /
            TARGET_INELIGIBLE / EXPORT_TOO_LARGE. No existing student information is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413': &a5
          $ref: '#/components/responses/TooLarge'
        '415': &a6
          $ref: '#/components/responses/UnsupportedMedia'
        '500': &a7
          $ref: '#/components/responses/InternalError'
        '503': &a8
          description:
            DATABASE_UNAVAILABLE / SESSION_UNAVAILABLE / REGISTRATION_STORAGE_UNAVAILABLE.
