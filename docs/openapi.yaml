        description:
          $ref: '#/components/schemas/CategoryDescription'
        image:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          nullable: true
          description:
            GridFS image id reference, syntactically validated only until media functionality
            exists; no URL/upload input
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
    CategoryAdmin:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - description
        - image
        - sortOrder
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        name:
          $ref: '#/components/schemas/CategoryName'
        slug:
          type: string
          minLength: 1
          maxLength: 120
          description:
            Normalized unique slug; if absent at creation derive from English name, otherwise
