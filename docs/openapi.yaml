components:
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data: {}
        meta:
          type: object
          nullable: true
          example: null
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ok
    ReadyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ready
    ErrorResponse:
      type: object
      required:
        - success
        - message
        - code
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - path
              - message
              - code
            properties:
              path:
                type: string
              message:
                type: string
              code:
                type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed/lowercased
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 72
          description:
            Not trimmed. At least 12 characters and at most 72 UTF-8 bytes, no NUL. Byte limit
            additionally enforced server-side.
    AdminProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
        - lastLoginAt
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - admin
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    AdminResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminProfile'
