components:
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data: {}
        meta:
          type: object
          nullable: true
          example: null
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ok
    ReadyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ready
    ErrorResponse:
      type: object
      required:
        - success
        - message
        - code
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - path
              - message
              - code
            properties:
              path:
                type: string
              message:
                type: string
              code:
                type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed/lowercased
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 72
          description:
            Not trimmed. At least 12 characters and at most 72 UTF-8 bytes, no NUL. Byte limit
            additionally enforced server-side.
    AdminProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
        - lastLoginAt
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - admin
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    AdminResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminProfile'
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          description: Trimmed display name
    CategoryName:
      type: object
      additionalProperties: false
      required:
        - ar
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 120
        en:
          type: string
          minLength: 1
          maxLength: 120
    CategoryDescription:
      type: object
      additionalProperties: false
      properties:
        ar:
          type: string
          maxLength: 4000
        en:
          type: string
          maxLength: 4000
    CategoryCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/CategoryName'
        slug:
          type: string
          minLength: 1
          maxLength: 120
          description:
            Normalized unique slug; if absent at creation derive from English name, otherwise
            Arabic. Supply explicit slug if name cannot form a valid slug.
        description:
          $ref: '#/components/schemas/CategoryDescription'
        image:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          nullable: true
          description:
            GridFS image id reference, syntactically validated only until media functionality
            exists; no URL/upload input
        isActive:
          type: boolean
          default: true
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/CategoryName'
        slug:
          type: string
          minLength: 1
          maxLength: 120
          description:
            Normalized unique slug; if absent at creation derive from English name, otherwise
            Arabic. Supply explicit slug if name cannot form a valid slug.
        description:
          $ref: '#/components/schemas/CategoryDescription'
        image:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          nullable: true
          description:
            GridFS image id reference, syntactically validated only until media functionality
            exists; no URL/upload input
        isActive:
          type: boolean
          default: true
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
    CategoryPublic:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - description
        - image
        - sortOrder
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
        name:
          $ref: '#/components/schemas/CategoryName'
        slug:
          type: string
          minLength: 1
          maxLength: 120
          description:
            Normalized unique slug; if absent at creation derive from English name, otherwise
