  /registrations:
    post:
      tags:
        - Registrations
      operationId: createRegistration
      summary: Submit lecture registration or course enrollment request
      description:
        JSON only, exact trusted Origin, per-IP limit 30 attempts/15 minutes; no session or
        CSRF token needed and no session is created. Explicit privacyConsent=true is mandatory.
        Server records consent timestamp. Lecture must be published/future, deadline not expired,
        capacity available; course must be published with active category.
        Pending/confirmed/attended reserve seats. A conditional atomic lecture counter increment and
        registration insert commit in one MongoDB transaction (replica set/Atlas required).
        Duplicate-key/failed insert rolls back the counter. Cancellation releases a seat exactly
        once. Reactivation reserves again and rechecks eligibility. Unique normalized phone+target
        indexes include cancelled records; register for different targets freely. No payment or
        notification integrations. Public projection never contains meetingUrl. Registration does
        not grant meeting URL access; administrators share meeting details manually outside the
        website. No public search/featured result contains private URLs. Course/category eligibility
        is checked in the transaction snapshot; concurrent administrative changes may commit after
        that snapshot.
      security: []
      parameters:
        - *a16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreateRequest'
            example:
              fullName: Ahmed Mohamed
              phone: '+201000000000'
              email: ahmed@example.com
              targetType: lecture
              targetId: 0123456789abcdef01234567
              privacyConsent: true
      responses:
        '201':
          description: Submit lecture registration or course enrollment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationReceiptResponse'
        '400': *a1
        '403': *a2
        '404': *a3
        '409': *a4
        '413': *a5
        '415': *a6
        '429':
          description: 'RATE_LIMITED: retry after Retry-After seconds.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '500': *a7
        '503': *a8
