          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CategoryPublicResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CategoryPublic'
    CategoryPublicListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CategoryPublic'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CategoryAdminResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CategoryAdmin'
    CategoryAdminListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CategoryAdmin'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
    CourseTitle:
      type: object
      additionalProperties: false
      required:
        - ar
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200
    CourseSummary:
      type: object
      additionalProperties: false
