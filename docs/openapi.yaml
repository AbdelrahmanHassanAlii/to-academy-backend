openapi: 3.0.3
info:
  title: TO Academy API
  version: 0.6.0
  description: TO Academy foundation, administrator sessions, Categories, Courses, Lectures and
    Registrations, Articles, Settings and GridFS Media. Implemented endpoints only. UTC timestamps; academy timezone Africa/Cairo.
    Registration writes require MongoDB replica set/Atlas.
servers:
  - url: /api/v1
tags:
  - name: Operations
  - name: Session foundation
  - name: Authentication
  - name: Administrators
  - name: Categories
  - name: Courses
  - name: Lectures
  - name: Registrations
  - name: Media
  - name: Articles
  - name: Settings
paths:
  /health:
    get:
      tags:
        - Operations
      operationId: getHealth
      summary: Process liveness; no database access or session creation
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
  /ready:
    get:
      tags:
        - Operations
      operationId: getReadiness
      summary: Live database ping and initialized session-store readiness
      responses:
        '200':
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Dependency unavailable or shutdown in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/csrf:
    get:
      tags:
        - Session foundation
      operationId: getCsrfToken
      summary: Issue or reuse a session-bound synchronizer token
      description:
        Exact allowed Origin required. Session-bound token with HttpOnly host-only cookie. Use
        credentials:include and X-CSRF-Token on session/admin writes. Login rotates cookie/token;
        fetch a fresh token afterward. No-store, 60 requests/minute/IP.
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          example: https://admin.toacademy.com
      responses:
        '200':
          description: Token issued; credentialed browser must accept the session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description:
                Opaque session cookie; HttpOnly, SameSite=Lax, Path=/, Secure in production. Never read
                or persist its value in JavaScript.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - csrfToken
                        properties:
                          csrfToken:
                            type: string
                            pattern: ^[a-f0-9]{64}$
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Existing session expired; fetch a fresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Session persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginAdmin
      summary: Authenticate an active administrator
      description:
        Requires a CSRF session first. Regenerates session, rotates CSRF and resets eight-hour
        absolute lifetime. Returns safe profile only; refetch GET /auth/csrf after success. Bad
        password, unknown email and inactive account all return generic INVALID_CREDENTIALS 401.
        Five failed attempts/15 minutes per IP and normalized account plus 60 requests/minute/IP.
        Success does not consume the failure budget. No public signup.
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          example: https://admin.toacademy.com
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
          description: Token from GET /auth/csrf bound to the current cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Safe administrator profile; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
              description:
                Replacement host-only HttpOnly SameSite=Lax cookie; Secure in production. Never in
                JSON.
        '400':
          description: Invalid JSON or validation; unknown fields rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, deleted/inactive identity, or invalid login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Untrusted Origin, invalid CSRF or insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          description: Login rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Session service unavailable; no raw driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags:
        - Authentication
      operationId: getCurrentAdmin
      summary: Read active authenticated administrator
      description: Reloads identity and role from MongoDB on every request.
        Missing/expired/deleted/inactive identities return 401. Revoked sessions destroyed.
        No-store.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Safe administrator profile; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '400':
          description: Invalid JSON or validation; unknown fields rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, deleted/inactive identity, or invalid login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Untrusted Origin, invalid CSRF or insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Session service unavailable; no raw driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutAdmin
      summary: Destroy current authenticated session
      description:
        Requires active authentication, trusted Origin and CSRF. Deletes session and expires
        matching cookie. Replayed cookie, me and repeated logout subsequently return 401. No-store.
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          example: https://admin.toacademy.com
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
          description: Token from GET /auth/csrf bound to the current cookie session
      responses:
        '200':
          description: Logged out; cookie cleared, data:null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        example: null
        '400':
          description: Invalid JSON or validation; unknown fields rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, deleted/inactive identity, or invalid login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Untrusted Origin, invalid CSRF or insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Session service unavailable; no raw driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/admins/me:
    get:
      tags:
        - Administrators
      operationId: getAdminProfile
      summary: Read own safe profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Safe administrator profile; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '400':
          description: Invalid JSON or validation; unknown fields rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, deleted/inactive identity, or invalid login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Untrusted Origin, invalid CSRF or insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Session service unavailable; no raw driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Administrators
      operationId: updateAdminProfile
      summary: Update own display name only
      description: All other fields rejected. No email/password/role/isActive edits.
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          example: https://admin.toacademy.com
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
          description: Token from GET /auth/csrf bound to the current cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Safe administrator profile; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '400':
          description: Invalid JSON or validation; unknown fields rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, expired, deleted/inactive identity, or invalid login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Untrusted Origin, invalid CSRF or insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Session service unavailable; no raw driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories:
    get:
      tags:
        - Categories
      operationId: listPublicCategories
      summary: List active categories only
      description: 'Always active-only. Sort by sortOrder ascending then id ascending. Strict query
        allowlist: page,limit,q; no public inactive filter. No session creation.'
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description:
            Trimmed literal case-insensitive search across Arabic/English names and slug; no
            regex/operators
      responses:
        '200':
          description: Paginated safe active categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPublicListResponse'
        '400':
          description: VALIDATION_ERROR or invalid JSON; strict params, queries and bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Untrusted browser Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DATABASE_UNAVAILABLE or SESSION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories/{slug}:
    get:
      tags:
        - Categories
      operationId: getPublicCategory
      summary: Retrieve an active category by normalized slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: Arabic/Latin/numbers/combining marks separated by hyphens;
            NFKC/lowercase/space-underscore normalization
      responses:
        '200':
          description: Safe active category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPublicResponse'
        '400':
          description: VALIDATION_ERROR or invalid JSON; strict params, queries and bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Untrusted browser Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: CATEGORY_NOT_FOUND; inactive categories indistinguishable from missing on public detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DATABASE_UNAVAILABLE or SESSION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/categories:
    get:
      tags:
        - Categories
      operationId: listAdminCategories
      summary: List all or filtered categories
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description:
            Trimmed literal case-insensitive search across Arabic/English names and slug; no
            regex/operators
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Only exact true/false strings; absent includes both states
      description:
        Requires active administrator. SortOrder then id ascending. Includes status/timestamps;
        no arbitrary sort/filter fields.
      responses:
        '200':
          description: Paginated admin category records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminListResponse'
        '400':
          description: VALIDATION_ERROR or invalid JSON; strict params, queries and bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/expired/inactive administrator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF/origin/role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DATABASE_UNAVAILABLE or SESSION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Categories
      operationId: createCategory
      summary: Create a localized category
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          example: https://admin.toacademy.com
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          description: VALIDATION_ERROR or invalid JSON; strict params, queries and bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/expired/inactive administrator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF/origin/role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: CATEGORY_SLUG_EXISTS after normalization; database unique index handles concurrent writes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DATABASE_UNAVAILABLE or SESSION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/categories/{id}:
    get:
      tags:
        - Categories
      operationId: getAdminCategory
      summary: Read a category including inactive records
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          description: VALIDATION_ERROR or invalid JSON; strict params, queries and bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/expired/inactive administrator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF/origin/role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: CATEGORY_NOT_FOUND; inactive categories indistinguishable from missing on public detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DATABASE_UNAVAILABLE or SESSION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Categories
      operationId: updateCategory
      summary: Edit category content, active state and order
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          example: https://admin.toacademy.com
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      description: Root fields omitted are preserved. Provided name/description objects replace that
        localized object; name always requires ar. image:null clears its reference. Slug changes are
        explicit; conflicts return409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          description: VALIDATION_ERROR or invalid JSON; strict params, queries and bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/expired/inactive administrator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF/origin/role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: CATEGORY_NOT_FOUND; inactive categories indistinguishable from missing on public detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: CATEGORY_SLUG_EXISTS after normalization; database unique index handles concurrent writes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DATABASE_UNAVAILABLE or SESSION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Categories
      operationId: deactivateCategory
      summary: Soft-deactivate a category; retain document and id
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          example: https://admin.toacademy.com
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      description:
        Sets isActive=false; never physically deletes. Retains course references. Public course
        reads hide courses whose category is inactive; reactivation restores otherwise published
        courses.
      responses:
        '200':
          description: Retained category with isActive:false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          description: VALIDATION_ERROR or invalid JSON; strict params, queries and bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/expired/inactive administrator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF/origin/role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: CATEGORY_NOT_FOUND; inactive categories indistinguishable from missing on public detail
          content:
            application/json:
